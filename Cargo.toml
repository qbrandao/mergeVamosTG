[package]
name = "mergeVamosTG"
version = "0.1.0"
edition = "2021"
assets = ["assets/"]

[[bin]]
name = "mergeVamosTG"
path = "src/main.rs"

[dependencies]
noodles = { version = "0.78", features = ["vcf", "bgzf", "core"] }
indexmap = "2.0"
flate2 = "1.0"
csv = "1.3"
serde = { version = "1.0", features = ["derive"] }
rayon = "1.10"

[profile.dev]
opt-level = 1
